<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Stats preview</title>
  <style>
    body { margin: 2rem auto; max-width: 960px; padding: 0 1rem; background: #0d1117; color: #e6edf3; font: 16px system-ui, sans-serif; }
    img { display: block; width: 100%; height: auto; margin: 1rem 0; }
    section { margin: 2rem 0; }
  </style>
</head>
<body>
  <h1>GitHub Stats — example data</h1>
  <section>
    <h2>Dark</h2>
    <img src="dark/stats.svg" alt="Example contribution stats, dark theme">
    <img src="dark/languages.svg" alt="Example language composition, dark theme">
    <img src="dark/activity.svg" alt="Example developer activity, dark theme">
  </section>
  <section>
    <h2>Light</h2>
    <img src="light/stats.svg" alt="Example contribution stats, light theme">
    <img src="light/languages.svg" alt="Example language composition, light theme">
    <img src="light/activity.svg" alt="Example developer activity, light theme">
  </section>
</body>
</html>
